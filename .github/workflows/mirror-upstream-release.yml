name: Mirror dictionary ZIP files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mirror-upstream-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag
        required: true
        default: v1.3.0
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: dictionary-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'danilfg/koreader-dicts'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || 'v1.3.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download ZIPs and check file count
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dicts"
          expected=$(gh api "repos/DanielGregorini/koreader-dicts/releases/tags/$TAG" --jq '[.assets[] | select(.name | endswith(".zip"))] | length')
          test "$expected" -gt 0
          gh release download "$TAG" -R DanielGregorini/koreader-dicts --pattern '*.zip' --dir "$RUNNER_TEMP/dicts"
          actual=$(find "$RUNNER_TEMP/dicts" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')
          echo "Downloaded $actual of $expected ZIP archives"
          test "$actual" = "$expected"
          ( cd "$RUNNER_TEMP/dicts" && sha256sum -- *.zip > SHA256SUMS )

      - name: Publish complete mirror as a fork release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft \
              --title "Dictionary archives $TAG (independent mirror)" \
              --notes "Independent mirror of DanielGregorini/koreader-dicts. Each original archive contains LICENSE and ATTRIBUTION; source authors and third-party licenses are retained."
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/dicts"/*.zip "$RUNNER_TEMP/dicts/SHA256SUMS" -R "$GITHUB_REPOSITORY" --clobber
          expected=$(find "$RUNNER_TEMP/dicts" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')
          actual=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | endswith(".zip"))] | length')
          echo "Published $actual of $expected ZIP archives"
          test "$actual" = "$expected"
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false

      - name: Switch download links to the fork
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#https://github.com/DanielGregorini/koreader-dicts/releases/latest/download/#https://github.com/danilfg/koreader-dicts/releases/latest/download/#g' README.md
          sed -i 's#https://github.com/DanielGregorini/koreader-dicts/releases/latest/download#https://github.com/danilfg/koreader-dicts/releases/latest/download#g' web/koreader-dicts/src/lib/repo.ts
          if ! git diff --quiet -- README.md web/koreader-dicts/src/lib/repo.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md web/koreader-dicts/src/lib/repo.ts
            git commit -m "Use fork release assets for dictionary downloads"
            git push origin HEAD:main
          fi

      - name: Republish GitHub Pages with updated links
        shell: bash
        run: |
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main
